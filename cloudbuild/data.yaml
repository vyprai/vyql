# Data hygiene + definition integrity on vypr-ci-amd64.
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: projects/valid-perigee-471809-r0/locations/europe-west3/workerPools/vypr-ci-amd64
steps:
  - id: hygiene
    name: golang:1.26
    entrypoint: bash
    env:
      - GOTOOLCHAIN=auto
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq git
        go install github.com/google/go-licenses@latest
        export PATH="$$(go env GOPATH)/bin:$$PATH"
        ./scripts/check-hygiene.sh

  - id: data-integrity
    name: golang:1.26
    entrypoint: bash
    env:
      - CGO_ENABLED=1
      - GOTOOLCHAIN=auto
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq build-essential git python3
        go build -o bin/vyql ./cmd/vyql
        VYQL_HOME=./vyql ./bin/vyql definitions -kind all > /tmp/defs.txt
        line="$$(grep -m1 '^loaded:' /tmp/defs.txt)"
        echo "$$line"
        get() { echo "$$line" | grep -oE "$$1=[0-9]+" | cut -d= -f2; }
        fail=0
        check() {
          if [ -z "$$2" ] || [ "$$2" -lt "$$3" ]; then
            echo "FAIL: $$1=$$2, expected at least $$3"; fail=1
          fi
        }
        check concepts "$$(get concepts)" 800
        check rules    "$$(get rules)"    700
        check bindings "$$(get bindings)" 30000
        check reviews  "$$(get reviews)"  500
        [ "$$fail" -eq 0 ]

        mkdir -p /tmp/sample
        cat > /tmp/sample/app.py <<'PY'
        import sqlite3
        from flask import Flask, request
        app = Flask(__name__)
        @app.route("/u")
        def u():
            name = request.args.get("name")
            conn = sqlite3.connect("app.db")
            return conn.execute("SELECT * FROM users WHERE name = '" + name + "'").fetchall()
        PY
        VYQL_HOME=./vyql ./bin/vyql scan -fail-on none --format json /tmp/sample > /tmp/findings.json
        n="$$(python3 -c "import json;d=json.load(open('/tmp/findings.json'));print(len(d if isinstance(d,list) else d.get('findings',[])))")"
        echo "findings: $$n"
        [ "$$n" -ge 1 ] || { echo "FAIL: no findings on an unmistakable SQL injection"; exit 1; }
