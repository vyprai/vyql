# Publish VyQL definition bundles to GCS.
#
# Tags use the definitions/v prefix so they do not collide with engine v* releases:
#   definitions/vX.Y.Z-free  → public  gs://dl.vyprsec.ai/vyql/definitions/free/
#   definitions/vX.Y.Z       → private gs://vypr-vyql-definitions-commercial/
#
# User-facing version is bare semver in latest.json and in-tree VERSION.
# Free tags belong on the definitions/free branch; commercial tags on main.
#
# Workload Identity Federation impersonates vypr-vyql-definitions@… (see
# vypr-infra terraform/global/vyql-definitions-publish.tf). The OIDC provider
# issues tokens on main or a tag, not on pull_request or a topic branch.

name: definitions-publish

on:
  push:
    tags:
      - "definitions/v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: definitions-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, vyql-private]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Parse tag
        id: meta
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # definitions/v1.2.3-free → version=1.2.3 channel=free
          # definitions/v1.2.3      → version=1.2.3 channel=commercial
          case "$REF" in
            definitions/v*-free)
              rest="${REF#definitions/v}"
              version="${rest%-free}"
              channel=free
              ;;
            definitions/v*)
              version="${REF#definitions/v}"
              channel=commercial
              ;;
            *)
              echo "unexpected tag: $REF" >&2
              exit 1
              ;;
          esac
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "tag must encode semver X.Y.Z (got $version from $REF)" >&2
              exit 1
              ;;
          esac
          case "$version" in
            *-*)
              echo "semver must not include prerelease in tag body: $version" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          echo "publishing channel=$channel version=$version"

      - name: Pack definitions
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          chmod +x scripts/pack-definitions.sh
          url=""
          case "$CHANNEL" in
            free) url="https://dl.vyprsec.ai/vyql/definitions/free/latest.tar.gz" ;;
            commercial) url="gs://vypr-vyql-definitions-commercial/latest.tar.gz" ;;
          esac
          ./scripts/pack-definitions.sh \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --out "${RUNNER_TEMP}/definitions-out" \
            --url "$url"
          ls -la "${RUNNER_TEMP}/definitions-out"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/722086909849/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: vypr-vyql-definitions@valid-perigee-471809-r0.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload free
        if: steps.meta.outputs.channel == 'free'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          OUT: ${{ runner.temp }}/definitions-out
        run: |
          set -euo pipefail
          prefix="gs://dl.vyprsec.ai/vyql/definitions/free"
          gcloud storage cp "$OUT/definitions.tar.gz" "$prefix/v${VERSION}.tar.gz"
          gcloud storage cp "$OUT/definitions.tar.gz.sha256" "$prefix/v${VERSION}.tar.gz.sha256"
          gcloud storage cp "$OUT/definitions.tar.gz" "$prefix/latest.tar.gz"
          gcloud storage cp "$OUT/definitions.tar.gz.sha256" "$prefix/latest.tar.gz.sha256"
          gcloud storage cp "$OUT/latest.json" "$prefix/latest.json"
          {
            echo "### Free definitions v${VERSION}"
            echo ""
            echo "- https://dl.vyprsec.ai/vyql/definitions/free/latest.tar.gz"
            echo "- https://dl.vyprsec.ai/vyql/definitions/free/latest.json"
            echo "- https://dl.vyprsec.ai/vyql/definitions/free/v${VERSION}.tar.gz"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload commercial
        if: steps.meta.outputs.channel == 'commercial'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          OUT: ${{ runner.temp }}/definitions-out
        run: |
          set -euo pipefail
          prefix="gs://vypr-vyql-definitions-commercial"
          gcloud storage cp "$OUT/definitions.tar.gz" "$prefix/v${VERSION}.tar.gz"
          gcloud storage cp "$OUT/definitions.tar.gz.sha256" "$prefix/v${VERSION}.tar.gz.sha256"
          gcloud storage cp "$OUT/definitions.tar.gz" "$prefix/latest.tar.gz"
          gcloud storage cp "$OUT/definitions.tar.gz.sha256" "$prefix/latest.tar.gz.sha256"
          gcloud storage cp "$OUT/latest.json" "$prefix/latest.json"
          {
            echo "### Commercial definitions v${VERSION}"
            echo ""
            echo "- Object: \`${prefix}/v${VERSION}.tar.gz\` (private)"
            echo "- Smoke signed URL (operator):"
            echo "  \`gcloud storage sign-url ${prefix}/v${VERSION}.tar.gz --duration=15m\`"
          } >> "$GITHUB_STEP_SUMMARY"
