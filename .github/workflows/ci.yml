name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Docs-only pull requests still have to satisfy the required checks, so the
  # workflow always runs and the expensive jobs decide for themselves. Path
  # filtering at the `on:` level would leave those checks Pending forever --
  # GitHub is explicit that a workflow skipped by a path filter never reports.
  #
  # A job skipped by a conditional does report, as success.
  changes:
    runs-on: ubuntu-latest
    # Granted here rather than at the workflow level: only this job reads the
    # pull request's file list, and nothing else needs the scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Anything that is not a pull request -- a push to main, the security
          # schedule, a manual run -- gets the full suite. Only a pull request
          # has a base to compare against.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: running everything"
            exit 0
          fi
          # Asked of the API rather than computed from a checkout: the working
          # tree is 34,000 files and this job exists to save time, not spend it
          # cloning three times over. --paginate covers pull requests with more
          # than one page of files.
          changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # The API stops at 3000 files. A larger pull request therefore arrives
          # truncated, and the files it did not name could be anything, so the
          # only safe reading of a full page is that this cannot be decided.
          if [ "$(printf '%s\n' "$changed" | grep -c .)" -ge 3000 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> more files than the API will list; running everything"
            exit 0
          fi
          # Inverted on purpose: anything that is not recognisably documentation
          # counts as code, so a new kind of file runs the full suite. Being
          # wrong that way costs runner minutes; the other way ships untested.
          #
          # Collected into a variable rather than tested through `grep -q`. With
          # `pipefail` set, `grep -q` exits at its first match and closes the
          # pipe, `printf` dies of SIGPIPE, and the pipeline reports that failure
          # rather than grep's success -- so the branch below was taken by
          # whether the list was long enough for grep to finish early, not by
          # what was in it. Every large pull request skipped its own tests and
          # reported a green build.
          noncode="$(printf '%s\n' "$changed" | grep -vE '^(docs/.*|.*\.md|LICENSE|NOTICE)$' || true)"
          if [ -n "$noncode" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> code changed; running everything"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> documentation only; the expensive steps will be skipped"
          fi
  build-test:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tree-sitter grammars are C. Without cgo the build constraints exclude
      # them silently rather than failing, so this is not a default worth trusting.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch definitions
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x scripts/ci-setup-definitions.sh
          eval "$(./scripts/ci-setup-definitions.sh)"

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: |
          go build -o bin/vyql ./cmd/vyql
          go build -o bin/gen-ontology-json ./cmd/gen-ontology-json

      - name: Vet
        if: needs.changes.outputs.code == 'true'
        run: go vet ./...

      # -count=1 is mandatory: the test cache keys on source and does not track
      # the .vyql data files, so a cached pass can hide a change to the security
      # knowledge base entirely. VYQL_HOME comes from ci-setup-definitions.sh
      # because go test has no -data flag.
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: go test -count=1 ./...

  lint:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch definitions
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x scripts/ci-setup-definitions.sh
          eval "$(./scripts/ci-setup-definitions.sh)"

      - name: gofmt
        if: needs.changes.outputs.code == 'true'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      # The action's major version selects the golangci-lint major version: v6
      # installs golangci-lint v1, which cannot read a `version: "2"` config and
      # refuses to run against a module targeting a newer Go than it was built
      # with. Pinned rather than `latest` so CI runs the same linter the
      # contributor documentation tells people to install.
      - uses: golangci/golangci-lint-action@v9
        if: needs.changes.outputs.code == 'true'
        with:
          version: v2.12.1

  # Every target we publish must build and RUN. A tag is a bad place to discover
  # that one of four platforms has been broken for weeks, so this runs on every
  # push to main rather than waiting for a release -- breakage surfaces within
  # one merge.
  #
  # Not on pull requests: these four legs are portability checks, and a change
  # that breaks a platform is nearly always one that breaks it on main too. The
  # pull request keeps `build-test` and `lint`, which is where a logic error
  # shows up. `release.yml` rebuilds all four natively before publishing, so a
  # tag is covered independently of this.
  #
  # Required status checks must not include these: a pull request never runs
  # them, and a required check that never runs blocks the pull request forever.
  #
  # Native runner per target: the grammars are C compiled by cgo, so a cross
  # build needs a cross C toolchain, and the point here is to exercise the same
  # path a user's machine would.
  matrix-build:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fetch definitions
        run: |
          chmod +x scripts/ci-setup-definitions.sh
          eval "$(./scripts/ci-setup-definitions.sh)"

      - name: Build
          # darwin/amd64 is cross-built on an arm64 runner rather than taken from
          # a macos-13 Intel runner: that image is being retired, and a job
          # requesting it sits unassigned indefinitely rather than failing. clang
          # targets x86_64 natively, so this is a supported cgo cross-build, not
          # a workaround.
        env:
          # Set explicitly rather than left to the host. A cross-build with only
          # CC set leaves Go targeting the runner's architecture while clang is
          # told another, and cgo fails with "cannot use 'cpp-output' output with
          # multiple -arch options". For the native targets these are no-ops that
          # state the intent.
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: go build -trimpath -ldflags "-s -w" -o dist/vyql ./cmd/vyql

      - name: Confirm the binary is for the target it claims
        run: |
          file dist/vyql
          go version -m dist/vyql | grep -E 'GOOS|GOARCH'
          go version -m dist/vyql | grep -q "GOOS=${{ matrix.goos }}" || { echo "wrong GOOS"; exit 1; }
          go version -m dist/vyql | grep -q "GOARCH=${{ matrix.goarch }}" || { echo "wrong GOARCH"; exit 1; }

      # Linking is not the bar. A binary that starts and then finds nothing --
      # because the parsers were excluded, or the data directory did not
      # resolve -- passes every check that stops at `go build`.
      - name: Run it, and require a real finding
        run: |
          mkdir -p /tmp/sample
          cat > /tmp/sample/app.py <<'PY'
          import sqlite3
          from flask import Flask, request
          app = Flask(__name__)

          @app.route("/u")
          def u():
              name = request.args.get("name")
              conn = sqlite3.connect("app.db")
              return conn.execute("SELECT * FROM users WHERE name = '" + name + "'").fetchall()
          PY
          # An x86_64 binary needs Rosetta to run on an arm64 runner, and the
          # hosted image may not have it. Where it runs, require a real finding;
          # where it cannot, say so rather than passing quietly -- the
          # architecture assertion above still applies either way.
          if ! ./dist/vyql version >/dev/null 2>&1; then
            echo "NOTE: ${{ matrix.goos }}/${{ matrix.goarch }} cannot be executed on $(uname -m);"
            echo "      architecture verified above, execution not exercised here."
            exit 0
          fi
          ./dist/vyql version
          n="$(./dist/vyql scan -data "$VYQL_DEFINITIONS" -fail-on none --format json /tmp/sample \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d if isinstance(d,list) else d.get("findings",[])))')"
          echo "findings: $n"
          [ "$n" -ge 1 ] || { echo "built, ran, detected nothing"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: vyql-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vyql
          retention-days: 14
