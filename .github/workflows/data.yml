name: data

# A Go-only pipeline would not notice that the security knowledge base is
# broken, which for this project is the likelier regression: the engine is small
# and the data is 30,000+ files.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Docs-only pull requests still have to satisfy the required checks, so the
  # workflow always runs and the expensive jobs decide for themselves. Path
  # filtering at the `on:` level would leave those checks Pending forever --
  # GitHub is explicit that a workflow skipped by a path filter never reports.
  #
  # A job skipped by a conditional does report, as success.
  changes:
    runs-on: ubuntu-latest
    # Granted here rather than at the workflow level: only this job reads the
    # pull request's file list, and nothing else needs the scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Anything that is not a pull request -- a push to main, the security
          # schedule, a manual run -- gets the full suite. Only a pull request
          # has a base to compare against.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: running everything"
            exit 0
          fi
          # Asked of the API rather than computed from a checkout: the working
          # tree is 34,000 files and this job exists to save time, not spend it
          # cloning three times over. --paginate covers pull requests with more
          # than one page of files.
          changed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Inverted on purpose: anything that is not recognisably documentation
          # counts as code, so a new kind of file runs the full suite. Being
          # wrong that way costs runner minutes; the other way ships untested.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/.*|.*\.md|LICENSE|NOTICE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> code changed; running everything"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> documentation only; the expensive steps will be skipped"
          fi
  hygiene:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/google/go-licenses@latest
        if: needs.changes.outputs.code == 'true'
      - run: ./scripts/check-hygiene.sh
        if: needs.changes.outputs.code == 'true'

  data-integrity:
    needs: changes
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the scanner
        if: needs.changes.outputs.code == 'true'
        run: go build -o bin/vyql ./cmd/vyql

      # Loads and parses every shipped definition -- concepts, bindings, rule
      # packs, reviews. A file that does not parse fails the command.
      - name: The full definition set loads
        if: needs.changes.outputs.code == 'true'
        run: VYQL_HOME=./vyql ./bin/vyql definitions -kind all > /tmp/defs.txt

      # Loading zero of something is the failure that looks like success: a glob
      # that stops matching reports a clean run over nothing at all. Assert
      # floors rather than trusting the exit code.
      - name: The definition counts are not silently zero
        if: needs.changes.outputs.code == 'true'
        run: |
          line="$(grep -m1 '^loaded:' /tmp/defs.txt)"
          echo "$line"
          get() { echo "$line" | grep -oE "$1=[0-9]+" | cut -d= -f2; }
          fail=0
          check() { # name, actual, floor
            if [ -z "$2" ] || [ "$2" -lt "$3" ]; then
              echo "FAIL: $1=$2, expected at least $3"; fail=1
            fi
          }
          check concepts "$(get concepts)" 800
          check rules    "$(get rules)"    700
          check bindings "$(get bindings)" 30000
          check reviews  "$(get reviews)"  500
          exit $fail

      - name: A scan produces findings on a known-vulnerable sample
        if: needs.changes.outputs.code == 'true'
        run: |
          mkdir -p /tmp/sample
          cat > /tmp/sample/app.py <<'PY'
          import sqlite3
          from flask import Flask, request
          app = Flask(__name__)

          @app.route("/u")
          def u():
              name = request.args.get("name")
              conn = sqlite3.connect("app.db")
              return conn.execute("SELECT * FROM users WHERE name = '" + name + "'").fetchall()
          PY
          # -fail-on none: the sample is deliberately vulnerable and the check
          # below requires at least one finding. The gate would fail the step on
          # exactly the outcome this asserts.
          VYQL_HOME=./vyql ./bin/vyql scan -fail-on none --format json /tmp/sample > /tmp/findings.json
          n="$(python3 -c "import json;d=json.load(open('/tmp/findings.json'));print(len(d if isinstance(d,list) else d.get('findings',[])))")"
          echo "findings: $n"
          # An engine that loads its data but detects nothing passes every check
          # above. This is the one that notices.
          [ "$n" -ge 1 ] || { echo "FAIL: no findings on an unmistakable SQL injection"; exit 1; }
