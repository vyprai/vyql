name: downloads

# Records release-asset download counts. GitHub reports the total now, not a
# history, so the series only exists because it is written down.
#
# It is written to the download-data branch, not to main. main requires seven
# status checks before a push lands, and a counter tick has no business running
# a build to record itself.
#
# Every six hours, keyed by date. The series stays one point per day, and the
# later runs correct that day's point as it moves: a release that lands just
# after a run would otherwise show the page a number up to a day stale.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out the collector
        uses: actions/checkout@v7

      - name: Check out the series
        uses: actions/checkout@v7
        with:
          ref: download-data
          path: series

      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOWNLOADS_JSON="$PWD/series/data/downloads.json" \
            python3 scripts/collect-downloads.py

      - name: Commit, only when something changed
        id: commit
        working-directory: series
        run: |
          set -euo pipefail
          if git diff --quiet -- data/downloads.json; then
            echo "no change; nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/downloads.json
          git commit -m "chore(data): download counts for $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Republishes the page so the number on it matches the number just recorded.
  # A reusable-workflow call rather than a dispatch: events raised with the
  # built-in token do not start new workflow runs, so a dispatch would record
  # the data and silently never deploy it.
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
