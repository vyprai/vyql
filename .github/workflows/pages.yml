name: pages

# Publishes site/ to GitHub Pages. The page is static HTML with no build step:
# nothing here can fail in a way that leaves a half-rendered page up, and the
# published bytes are the ones in the repository.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/render-downloads.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Called by the downloads workflow once it has recorded a new snapshot. The
  # series lives on another branch, so a push there deploys nothing on its own
  # and the published counter would sit at whatever it read on the last content
  # edit.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should not race a running one onto the live site, but an
# in-flight deploy is worth finishing rather than cancelling half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the download series
        uses: actions/checkout@v7
        with:
          ref: download-data
          path: series

      # Ahead of the completeness check on purpose, so the third-party-request
      # check below reads the generated markup rather than the placeholder.
      - name: Render the download section
        run: |
          set -euo pipefail
          DOWNLOADS_JSON="$PWD/series/data/downloads.json" \
            python3 scripts/render-downloads.py

      - name: Check the page is complete
        run: |
          set -euo pipefail
          test -f site/index.html
          # The install command is the page's only call to action. A page that
          # loses it still looks fine and converts nobody.
          grep -q "dl.vyprsec.ai/vyql/install.sh" site/index.html
          grep -q "vyql update -yes" site/index.html
          # Copy buttons are attached to these markers at runtime. Losing the
          # attribute removes every button and leaves a page that still looks
          # entirely correct.
          test "$(grep -o 'data-copy>' site/index.html | wc -l)" -ge 5
          # The fonts are served from this origin on purpose. A missing file
          # falls back to system-ui and looks merely slightly off, so nothing
          # else would report it.
          test -s site/fonts/geist-variable.woff2
          test -s site/fonts/geist-mono-variable.woff2
          test -s site/fonts/OFL.txt
          # The custom domain lives in the published artifact, not in repo
          # settings. A missing CNAME silently reverts the site to
          # vyprai.github.io and the canonical then points somewhere else.
          grep -qx "vyql.vyprsec.ai" site/CNAME
          # Third-party requests are the thing this page deliberately does not
          # make; a font or script CDN creeping in should fail here.
          if grep -nE 'https?://(fonts|cdn|unpkg|jsdelivr|ajax)\.' site/index.html; then
            echo "::error::site/index.html fetches from a third-party host"
            exit 1
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
