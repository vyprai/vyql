name: release

# Builds natively on each Linux target rather than cross-compiling. The
# tree-sitter grammars are C compiled by cgo, so a cross build needs a cross C
# toolchain for every target; a native runner per platform is simpler and is
# what actually gets tested. Without cgo the build fails outright rather than
# silently producing a binary that cannot parse anything.
#
# Linux only on the vyql-private self-hosted pool. There is no mac runner in
# that pool, so darwin archives are not produced here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # A dispatch runs from a branch, so github.ref_name is that branch, not a
        # version. This input is what makes the dry run rehearse the real thing:
        # it names the version to stamp and to build the archive names from.
        description: "Version to build, e.g. v0.2.0 (dry run; nothing is published)"
        required: true

permissions:
  contents: read

# Resolved once, here, rather than in each step. A dispatch runs from a branch,
# so github.ref_name is that branch and the input is what carries the version; a
# tag push has no input and ref_name is the tag. Steps read $VERSION from the
# environment instead of interpolating it, so the value is never substituted into
# a shell command as text.
env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  # Two builds of the same commit, from two different source paths, must produce
  # byte-identical binaries. That is what -trimpath buys, and asserting it here
  # means a release artifact can be rebuilt and checked by anyone.
  #
  # It holds only from a clean checkout: the Go toolchain embeds vcs.revision,
  # vcs.time and vcs.modified, so a dirty tree or a missing .git changes the
  # hash. Verified locally -- identical across paths with .git present, different
  # without it.
  reproducible:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x64, vyql-private]
          - runner: [self-hosted, linux, arm64, vyql-private]
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Confirm the tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the checkout is dirty; vcs.modified would be stamped true"
            git status --porcelain
            exit 1
          fi

      - name: Build twice, from two different paths
        run: |
          FLAGS=(-trimpath -ldflags "-s -w -X main.version=${VERSION}")
          go build "${FLAGS[@]}" -o /tmp/build-a ./cmd/vyql

          cp -R "$GITHUB_WORKSPACE" /tmp/elsewhere
          cd /tmp/elsewhere
          go build "${FLAGS[@]}" -o /tmp/build-b ./cmd/vyql

      - name: The two builds must be byte-identical
        run: |
          a="$(shasum -a 256 /tmp/build-a | cut -d' ' -f1)"
          b="$(shasum -a 256 /tmp/build-b | cut -d' ' -f1)"
          echo "path A: $a"
          echo "path B: $b"
          if [ "$a" != "$b" ]; then
            echo "build is not reproducible across source paths"
            go version -m /tmp/build-a > /tmp/meta-a.txt
            go version -m /tmp/build-b > /tmp/meta-b.txt
            diff /tmp/meta-a.txt /tmp/meta-b.txt || true
            exit 1
          fi
          echo "reproducible: $a"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x64, vyql-private]
            goos: linux
            goarch: amd64
          - runner: [self-hosted, linux, arm64, vyql-private]
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          # Set explicitly rather than left to the host. A cross-build with only
          # CC set leaves Go targeting the runner's architecture while clang is
          # told another, and cgo fails with "cannot use 'cpp-output' output with
          # multiple -arch options". For the native targets these are no-ops that
          # state the intent.
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/vyql ./cmd/vyql

      - name: Verify the binary reports the tag it was built from
        run: |
          got="$(./dist/vyql version | head -1)"
          echo "$got"
          [ "$got" = "vyql ${VERSION}" ] || { echo "expected 'vyql ${VERSION}'"; exit 1; }

      # The data directory ships with the binary. VyQL loads all of its security
      # knowledge from it at startup, so a release archive without it produces a
      # binary that starts and then cannot do anything.
      - name: Assemble the archive
        run: |
          NAME="vyql_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          # The binary goes in bin/. It cannot sit beside the data directory at
          # the archive root: both are called "vyql", and the second copy
          # overwrites the first. Running ./bin/vyql from the extracted
          # directory still resolves ./vyql, because the data directory is
          # found by searching the working directory and its ancestors.
          mkdir -p "stage/${NAME}/bin"
          cp dist/vyql "stage/${NAME}/bin/vyql"
          cp -R vyql "stage/${NAME}/vyql"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "stage/${NAME}/"
          tar -czf "${NAME}.tar.gz" -C stage "${NAME}"
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -la "${NAME}.tar.gz"

      # Prove the archive works the way a user will use it: extract somewhere
      # unrelated, run it with no VYQL_HOME set, and require a real finding. A
      # release that starts but detects nothing has failed in the way that
      # matters.
      - name: Smoke-test the archive as a user would
        run: |
          NAME="vyql_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p /tmp/smoke && tar -xzf "${NAME}.tar.gz" -C /tmp/smoke
          mkdir -p /tmp/sample
          cat > /tmp/sample/app.py <<'PY'
          import sqlite3
          from flask import Flask, request
          app = Flask(__name__)

          @app.route("/u")
          def u():
              name = request.args.get("name")
              conn = sqlite3.connect("app.db")
              return conn.execute("SELECT * FROM users WHERE name = '" + name + "'").fetchall()
          PY
          cd /tmp/smoke/"${NAME}"
          if ! ./bin/vyql version >/dev/null 2>&1; then
            echo "NOTE: ${{ matrix.goos }}/${{ matrix.goarch }} cannot be executed on $(uname -m);"
            echo "      the archive is assembled and checksummed, but not run here."
            exit 0
          fi
          # No VYQL_HOME: this is how someone who downloaded the archive runs it.
          env -u VYQL_HOME ./bin/vyql version
          n="$(env -u VYQL_HOME ./bin/vyql scan -fail-on none --format json /tmp/sample | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d if isinstance(d,list) else d.get("findings",[])))')"
          echo "findings: $n"
          [ "$n" -ge 1 ] || { echo "the release archive detects nothing"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: vyql-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64, vyql-private]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts

      # A release page is where someone arrives from a search result or the
      # Marketplace listing, and generate_release_notes alone gives them a list
      # of our pull request titles. The CHANGELOG entry is what was written for
      # a reader, so it leads; the commit log follows underneath.
      - name: Lead with the changelog entry for this version
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          # Everything between this version's heading and the next one.
          # A literal prefix match, not a regex: awk -v processes backslashes,
          # so "## \\[$VER\\]" reaches the program as a character class and
          # silently matches nothing.
          awk -v tag="## [$VER]" '
            index($0, tag) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::warning::no CHANGELOG entry for $VER; falling back to the generated notes alone"
            : > /tmp/notes.md
          fi
          echo "Full detail in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." >> /tmp/notes.md
          cat /tmp/notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          body_path: /tmp/notes.md
          append_body: true
          generate_release_notes: true

  # The Homebrew tap formula needs darwin and linux checksums. This workflow
  # only publishes linux archives, so the tap is not updated from here.

  # The image fetches the published release archive rather than compiling, so it
  # cannot run until publish has uploaded the assets, and cross-building costs
  # only an untar under emulation rather than a cgo build.
  container:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: [self-hosted, linux, x64, vyql-private]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VYQL_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/vyprai/vyql:${{ env.VERSION }}
            ghcr.io/vyprai/vyql:latest

      - name: Prove the published image runs and detects
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          cat > /tmp/probe/app.py <<'PY'
          import sqlite3
          def handler(req):
              cur = sqlite3.connect("d").cursor()
              cur.execute("SELECT * FROM t WHERE a = '" + req.args.get("a") + "'")
          PY
          # -fail-on none because a finding is the expected outcome here, and a
          # non-zero exit would read as the image being broken.
          docker run --rm -v /tmp/probe:/work "ghcr.io/vyprai/vyql:${VERSION}" \
            scan -fail-on none . | tee /tmp/out.txt
          grep -q "VYQL-INJ" /tmp/out.txt
